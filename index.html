<!-- AUTH SCREEN -->
<div id="authScreen" class="auth-screen">

  <!-- LOGIN -->
  <div id="loginBox" class="auth-box">
    <h1>SocialX</h1>
    <p class="auth-subtitle">Login to your account</p>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
      autocomplete="email"
    />

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    />

    <button id="loginBtn">Login</button>

    <button id="forgotBtn" class="text-btn">
      Forgot Password?
    </button>

    <p id="loginError" class="auth-error"></p>

    <div class="auth-switch">
      Don't have an account?
      <button id="showSignupBtn" class="text-btn">Create Account</button>
    </div>
  </div>


  <!-- SIGNUP -->
  <div id="signupBox" class="auth-box" style="display:none;">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Create your SocialX account</p>

    <input
      type="text"
      id="signupUsername"
      placeholder="Username"
      autocomplete="username"
    />

    <input
      type="email"
      id="signupEmail"
      placeholder="Email"
      autocomplete="email"
    />

    <input
      type="password"
      id="signupPassword"
      placeholder="Password"
      autocomplete="new-password"
    />

    <input
      type="password"
      id="signupConfirmPassword"
      placeholder="Confirm Password"
      autocomplete="new-password"
    />

    <button id="signupBtn">Create Account</button>

    <p id="signupError" class="auth-error"></p>

    <div class="auth-switch">
      Already have an account?
      <button id="showLoginBtn" class="text-btn">Login</button>
    </div>
  </div>

</div>
