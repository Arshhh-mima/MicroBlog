}

.message.mine .bubble{
    background:#111;

}

.chat-input{

}

/* MOBILE */

@media(max-width:850px){

        flex:1;

        height:calc(100vh - 160px);
    }

        align-items:flex-start;

}
</style>
</head>

<script type="module">

/* =========================================================
   FIREBASE
   ========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    setDoc,
    addDoc,
    getDoc,
    getDocs,
    updateDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    limit
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";


/* =========================================================
   YOUR FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyB5f1x7ja-IYq3h9YXgO1PLNqM9Hz56jaQ",

    authDomain:
        "socialx-3378d.firebaseapp.com",

    projectId:
        "socialx-3378d",

    storageBucket:
        "socialx-3378d.firebasestorage.app",

    messagingSenderId:
        "791171694714",

    appId:
        "1:791171694714:web:1a9fe3090c9fb7af00fbc3",

    measurementId:
        "G-BND8J1DHDY"
};


/* =========================================================
   INITIALIZE
   ========================================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const storage =
    getStorage(app);


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let user = null;
let profile = null;
let selectedUser = null;

let unsubscribePosts = null;
let unsubscribeMessages = null;


/* =========================================================
   AUTH
   ========================================================= */

window.showSignup = function(){

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("signupForm")
        .classList.remove("hidden");
};


window.showLogin = function(){

    document
        .getElementById("signupForm")
        .classList.add("hidden");

    document
        .getElementById("loginForm")
        .classList.remove("hidden");
};


window.signup = async function(){

    const username =
        document
        .getElementById("signupUsername")
        .value
        .trim();

    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("signupPassword")
        .value;

    if(!username || !email || !password){

        alert("Please fill all fields.");
        return;
    }

    if(password.length < 6){

        alert(
            "Password must contain at least 6 characters."
        );

        return;
    }

    try{

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        await setDoc(
            doc(db,"users",result.user.uid),
            {
                uid:result.user.uid,
                username:username,
                email:email,
                avatar:"",
                followers:0,
                following:0,
                createdAt:serverTimestamp()
            }
        );

    }catch(error){

        alert(error.message);
    }
};


window.login = async function(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    if(!email || !password){

        alert("Enter email and password.");
        return;
    }

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        alert(error.message);
    }
};


window.logout = async function(){

    await signOut(auth);
};


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(
    auth,
    async firebaseUser => {

        if(firebaseUser){

            user = firebaseUser;

            await loadMyProfile();

            document
                .getElementById("authScreen")
                .classList.add("hidden");

            document
                .getElementById("app")
                .classList.remove("hidden");

            loadPosts();
            loadPeople();
            renderProfile();

        }else{

            user = null;
            profile = null;

            document
                .getElementById("app")
                .classList.add("hidden");

            document
                .getElementById("authScreen")
                .classList.remove("hidden");
        }

    }
);


/* =========================================================
   PROFILE
   ========================================================= */

async function loadMyProfile(){

    const snap =
        await getDoc(
            doc(db,"users",user.uid)
        );

    if(snap.exists()){

        profile = snap.data();

    }else{

        profile = {
            uid:user.uid,
            username:user.email.split("@")[0],
            avatar:""
        };

        await setDoc(
            doc(db,"users",user.uid),
            profile
        );
    }

    const avatar =
        profile.avatar ||
        avatarURL(profile.username);

    document
        .getElementById("myAvatar")
        .src = avatar;
}


function avatarURL(name){

    return "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(name || "User");
}


/* =========================================================
   POSTS
   ========================================================= */

window.createPost = async function(){

    const text =
        document
        .getElementById("postText")
        .value
        .trim();

    const file =
        document
        .getElementById("postFile")
        .files[0];

    if(!text && !file){

        alert("Write something or select a photo.");
        return;
    }

    try{

        let image = "";

        if(file){

            const fileRef =
                ref(
                    storage,
                    "posts/" +
                    user.uid +
                    "/" +
                    Date.now() +
                    "_" +
                    file.name
                );

            await uploadBytes(
                fileRef,
                file
            );

            image =
                await getDownloadURL(fileRef);
        }

        await addDoc(
            collection(db,"posts"),
            {
                uid:user.uid,
                username:profile.username,
                avatar:profile.avatar || "",
                text:text,
                image:image,
                likes:0,
                createdAt:serverTimestamp()
            }
        );

        document
            .getElementById("postText")
            .value = "";

        document
            .getElementById("postFile")
            .value = "";

    }catch(error){

        alert(error.message);
    }
};


function loadPosts(){

    if(unsubscribePosts){
        unsubscribePosts();
    }

    const postsQuery =
        query(
            collection(db,"posts"),
            orderBy("createdAt","desc"),
            limit(50)
        );

    unsubscribePosts =
        onSnapshot(
            postsQuery,
            snapshot => {

                const posts = [];

                snapshot.forEach(
                    item => {

                        posts.push({
                            id:item.id,
                            ...item.data()
                        });

                    }
                );

                renderPosts(
                    posts,
                    "posts"
                );
            },
            error => {

                console.log(error);

                document
                    .getElementById("posts")
                    .innerHTML = `
                    <div class="card">
                        ${escapeHTML(error.message)}
                    </div>
                    `;
            }
        );
}


function renderPosts(posts,id){

    const container =
        document.getElementById(id);

    if(!container) return;

    if(!posts.length){

        container.innerHTML = `
            <div class="card">
                No posts yet.
            </div>
        `;

        return;
    }

    container.innerHTML =
        posts.map(post => {

            const username =
                post.username || "user";

            const avatar =
                post.avatar ||
                avatarURL(username);

            let date = "";

            if(post.createdAt){

                date =
                    post.createdAt
                    .toDate()
                    .toLocaleString();
            }

            return `

            <article class="card">

                <div class="post-head">

                    <img
                        class="avatar"
                        src="${escapeHTML(avatar)}">

                    <div>

                        <div class="post-name">
                            @${escapeHTML(username)}
                        </div>

                        <div class="post-date">
                            ${escapeHTML(date)}
                        </div>

                    </div>

                </div>

                ${
                    post.text
                    ?
                    `<div class="post-text">
                        ${escapeHTML(post.text)}
                    </div>`
                    :
                    ""
                }

                ${
                    post.image
                    ?
                    `<img
                        class="post-image"
                        src="${escapeHTML(post.image)}">`
                    :
                    ""
                }

                <div class="post-actions">

                    <button class="action">
                        Like
                    </button>

                    <button class="action">
                        Comment
                    </button>

                    <button class="action">
                        Share
                    </button>

                </div>

            </article>

            `;

        }).join("");
}


/* =========================================================
   SEARCH
   ========================================================= */

window.searchUsers = async function(value){

    const results =
        document.getElementById("searchResults");

    value =
        value.trim().toLowerCase();

    if(!value){

        results.innerHTML = "";
        return;
    }

    try{

        const snap =
            await getDocs(
                collection(db,"users")
            );

        const users = [];

        snap.forEach(item => {

            const data = item.data();

            if(
                data.username &&
                data.username
                    .toLowerCase()
                    .includes(value)
            ){

                users.push(data);
            }

        });

        results.innerHTML =
            users.map(item => {

                const avatar =
                    item.avatar ||
                    avatarURL(item.username);

                return `

                <div class="user">

                    <div class="user-left">

                        <img
                            class="avatar"
                            src="${escapeHTML(avatar)}">

                        <b>
                            @${escapeHTML(item.username)}
                        </b>

                    </div>

                    ${
                        item.uid !== user.uid
                        ?
                        `<button
                            class="secondary"
                            onclick="openMessage('${item.uid}')">
                            Message
                        </button>`
                        :
                        ""
                    }

                </div>

                `;

            }).join("");

    }catch(error){

        results.innerHTML =
            `<div class="card">
                ${escapeHTML(error.message)}
            </div>`;
    }
};


window.globalSearch = function(value){

    if(value.trim()){

        page("search");

        document
            .getElementById("searchInput")
            .value = value;

        searchUsers(value);
    }
};


/* =========================================================
   PEOPLE / MESSAGES
   ========================================================= */

async function loadPeople(){

    const container =
        document.getElementById("people");

    const snap =
        await getDocs(
            collection(db,"users")
        );

    const users = [];

    snap.forEach(item => {

        const data = item.data();

        if(data.uid !== user.uid){

            users.push(data);
        }
    });

    container.innerHTML =
        users.map(item => {

            const avatar =
                item.avatar ||
                avatarURL(item.username);

            return `

            <div
                class="person"
                onclick="openMessage('${item.uid}')">

                <div class="user-left">

                    <img
                        class="avatar"
                        src="${escapeHTML(avatar)}">

                    <span>
                        @${escapeHTML(item.username)}
                    </span>

                </div>

            </div>

            `;

        }).join("");
}


window.openMessage = async function(uid){

    const snap =
        await getDoc(
            doc(db,"users",uid)
        );

    if(!snap.exists()) return;

    selectedUser = snap.data();

    page("messages");

    document
        .getElementById("chatHeader")
        .textContent =
        "@" + selectedUser.username;

    listenMessages();
};


function conversationId(a,b){

    return [a,b]
        .sort()
        .join("_");
}


function listenMessages(){

    if(!selectedUser) return;

    if(unsubscribeMessages){

        unsubscribeMessages();
    }

    const conversation =
        conversationId(
            user.uid,
            selectedUser.uid
        );

    const messagesQuery =
        query(
            collection(
                db,
                "conversations",
                conversation,
                "messages"
            ),
            orderBy("createdAt","asc")
        );

    unsubscribeMessages =
        onSnapshot(
            messagesQuery,
            snapshot => {

                const messages = [];

                snapshot.forEach(item => {

                    messages.push({
                        id:item.id,
                        ...item.data()
                    });

                });

                renderMessages(messages);
            }
        );
}


function renderMessages(messages){

    const body =
        document.getElementById("chatBody");

    body.innerHTML =
        messages.map(message => {

            const mine =
                message.senderId === user.uid;

            return `

            <div
                class="message ${mine ? "mine" : ""}">

                <div class="bubble">
                    ${escapeHTML(message.text)}
                </div>

            </div>

            `;

        }).join("");

    body.scrollTop =
        body.scrollHeight;
}


window.sendMessage = async function(){

    if(!selectedUser){

        alert("Select a user first.");
        return;
    }

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;

    const conversation =
        conversationId(
            user.uid,
            selectedUser.uid
        );

    try{

        await addDoc(
            collection(
                db,
                "conversations",
                conversation,
                "messages"
            ),
            {
                senderId:user.uid,
                receiverId:selectedUser.uid,
                text:text,
                createdAt:serverTimestamp()
            }
        );

        input.value = "";

    }catch(error){

        alert(error.message);
    }
};


window.messageKey = function(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();
    }
};

async function renderProfile(){

    if(!profile) return;

    const avatar =
        profile.avatar ||
        avatarURL(profile.username);

    const snap =
        await getDocs(
            query(
                collection(db,"posts"),
                where("uid","==",user.uid)
            )
        );

    document
        .getElementById("profile")
        .innerHTML = `

        <div class="card">

            <div class="profile-top">

                <img
                    class="profile-avatar"
                    src="${escapeHTML(avatar)}">

                <div>

                    <div class="profile-username">
                        @${escapeHTML(profile.username)}
                    </div>

                    <div class="profile-stats">

                        <span>
                            <b>${snap.size}</b> posts
                        </span>

                        <span>
                            <b>${profile.followers || 0}</b>
                            followers
                        </span>

                        <span>
                            <b>${profile.following || 0}</b>
                            following
                        </span>

                    </div>

                </div>

            </div>

        </div>

        <div id="profilePosts"></div>
        `;

    const posts = [];

    snap.forEach(item => {

        posts.push({
            id:item.id,
            ...item.data()
        });

    });

    posts.sort(
        (a,b) => {

            const aa =
                a.createdAt
                ? a.createdAt.seconds
                : 0;

            const bb =
                b.createdAt
                ? b.createdAt.seconds
                : 0;

            return bb-aa;
        }
    );

    renderPosts(
        posts,
        "profilePosts"
    );
}

window.page = function(name,button){

    const pages = [
        "home",
        "search",
        "explore",
        "reels",
        "messages",
        "notifications",
        "profile"
    ];

    pages.forEach(item => {

        const el =
            document.getElementById(
                item + "Page"
            );

        if(el){
            el.classList.add("hidden");
        }
    });

    const selected =
        document.getElementById(
            name + "Page"
        );

    if(selected){
        selected.classList.remove("hidden");
    }

    document
        .querySelectorAll(".nav")
        .forEach(item =>
            item.classList.remove("active")
        );

    if(button){
        button.classList.add("active");
    }

    if(name === "explore"){

        loadExplore();
    }

    if(name === "messages"){

        loadPeople();
    }

    if(name === "profile"){

        renderProfile();
    }
};


async function loadExplore(){

    const snap =
        await getDocs(
            query(
                collection(db,"posts"),
                orderBy("createdAt","desc"),
                limit(50)
            )
        );

    const posts = [];

    snap.forEach(item => {

        posts.push({
            id:item.id,
            ...item.data()
        });

    });

    renderPosts(
        posts,
        "explorePosts"
    );
}

   HELPERS
   ========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
